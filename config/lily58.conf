# --- CORE ZMK WPM CONFIGURATION (WAJIB UNTUK SPEEDOMETER) ---
# Mengaktifkan pelacak kecepatan mengetik di core ZMK agar data bisa dibaca oleh OLED
CONFIG_ZMK_WPM=y

# --- DISPLAY CONFIGURATION ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_ON=y

# --- MEMORY & PERFORMANCE OPTIMIZATION ---
# Alokasi RAM wajib diperbesar agar layar kiri tidak hang/freeze saat merender grafik
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=y

# --- CENTRAL SCREEN WIDGETS (SISI KIRI) ---
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

# --- HID INDICATORS (SISI KIRI) ---
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=y

# --- PERIPHERAL SCREEN WIDGETS (SISI KANAN) ---
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y

# --- POWER & CONNECTIVITY ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y

# --- ZMK STUDIO ---
CONFIG_ZMK_STUDIO=y
